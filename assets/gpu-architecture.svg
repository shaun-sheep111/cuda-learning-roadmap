<title id="title">GPU 结构、执行层级与 CPU 通信</title>
<desc id="desc">CPU 经 PCIe 和 DMA 与 GPU 显存通信；GPU 包含工作分发器、SM、L2 与显存。Grid 分成 Block，Block 驻留在 SM，Warp 由 32 个线程组成。</desc>
