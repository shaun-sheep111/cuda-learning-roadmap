<text x="964" y="209" font-size="16" fill="#f2f4ed" font-weight="600">软件工作 → 硬件执行</text>
<text x="964" y="245" font-size="16" fill="#a1e52c" font-weight="500">Grid</text>
<text x="964" y="268" font-size="12" fill="#b4c2a8" font-weight="400">一次 kernel 的全部 Block</text>
<text x="964" y="310" font-size="16" fill="#a1e52c" font-weight="500">Block → SM</text>
<text x="964" y="333" font-size="12" fill="#b4c2a8" font-weight="400">协作线程块整体驻留</text>
<text x="964" y="375" font-size="16" fill="#a1e52c" font-weight="500">Warp → 执行管线</text>
<text x="964" y="398" font-size="12" fill="#b4c2a8" font-weight="400">32 个线程，按 Warp 发射</text>
<text x="964" y="440" font-size="16" fill="#a1e52c" font-weight="500">Thread → 私有状态</text>
<text x="964" y="463" font-size="12" fill="#b4c2a8" font-weight="400">寄存器 / 索引 / 谓词</text>
<text x="44" y="413" font-size="11" fill="#a1e52c" font-weight="600">命令路径</text>
<text x="44" y="440" font-size="12" fill="#b4c2a8" font-weight="400">Runtime / Driver</text>
<text x="44" y="465" font-size="12" fill="#b4c2a8" font-weight="400">→ Stream 队列</text>
<text x="44" y="490" font-size="12" fill="#b4c2a8" font-weight="400">→ GPU 工作分发</text>
<path d="M44 553 H1236" stroke="#34412c" fill="none"/>
<text x="44" y="584" font-size="12" fill="#a1e52c" font-weight="600">一次计算的旅程</text>
<text x="44" y="620" font-size="19" fill="#f2f4ed" font-weight="400">分配显存 → H2D 拷入 → Kernel 分发 → Warp 计算 → D2H 拷回 → 同步 → 释放</text>
<text x="44" y="669" font-size="11" fill="#b4c2a8" font-weight="400">通用独立 GPU 教学示意，组件数量不代表实际芯片配置。CPU–GPU NVLink-C2C 仅适用于支持的平台。</text>
<text x="1060" y="669" font-size="15" fill="#a1e52c" font-weight="600">交互探索 ↗</text>
